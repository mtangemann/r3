name: lint

on:
  pull_request:
    branches:
      - main
      - dev


jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Run ruff
        uses: pre-commit/action@v3.0.1


  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run mypy
        run: uv run mypy r3 test migration


  pytest:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 gets the full history: a git-dependency test clones this
      # repo and checks out an old commit, which the default shallow clone omits.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      # AWS_CONFIG_FILE=/dev/null keeps a global ~/.aws/config (endpoint_url) from
      # bypassing moto. live_s3 tests need real credentials and stay out of CI.
      - name: Run tests
        run: AWS_CONFIG_FILE=/dev/null uv run python -m pytest -m "not live_s3"
